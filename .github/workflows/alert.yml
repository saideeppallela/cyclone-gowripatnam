name: Gowripatnam Weather Alerts

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'
    - cron: '0 16 * * *'

permissions:
  contents: write

jobs:
  weather-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run weather alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alert.py

      - name: Save forecast state and history
        run: |
          if [[ -n "$(git status --porcelain -- state.json history.csv)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+users.noreply.github.com"
            git add state.json history.csv
            git commit -m "Update weather forecast history"
            git push
          fi
